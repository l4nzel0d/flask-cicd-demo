# Инфраструктура практической работы №4: контроллер Jenkins и локальный реестр.
# Контейнеры staging и production здесь намеренно отсутствуют — их создаёт
# и пересоздаёт сам пайплайн.
name: pract4

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: pract4/jenkins-dood:1.0
    container_name: pract4-jenkins
    restart: unless-stopped
    # Docker Desktop предъявляет проброшенный сокет как root:root (GID 0).
    user: root
    environment:
      TZ: Europe/Moscow
      JAVA_OPTS: "-Duser.timezone=Europe/Moscow -Dhudson.model.ParametersAction.keepUndefinedParameters=false"
    ports:
      - "8080:8080"
      # Порт 50000 (JNLP) не публикуется: Windows резервирует диапазон
      # 50000-50059, а внешние агенты в этой работе не используются.
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [cicd, staging, prod]

  registry:
    image: registry:2
    container_name: pract4-registry
    restart: unless-stopped
    ports:
      # Порт обязательно публикуется: команды push/pull выполняет демон хоста,
      # который не входит в сеть cicd и видит реестр только как localhost:5000.
      - "5000:5000"
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry_data:/var/lib/registry
    networks: [cicd]

volumes:
  jenkins_home:
    name: pract4_jenkins_home
  registry_data:
    name: pract4_registry_data

# Явные name: обязательны — иначе Compose добавит префикс проекта и получится
# pract4_cicd, тогда как Jenkinsfile ожидает pract4-cicd.
networks:
  cicd:
    name: pract4-cicd
  staging:
    name: pract4-staging
  prod:
    name: pract4-prod
